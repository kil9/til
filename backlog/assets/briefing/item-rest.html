<article>
  <h4><a href="{{URL}}">{{TITLE}}</a></h4>
  <p>{{SUMMARY}}</p>
  <button class="go" data-topic="{{ACTION_TOPIC}}" data-url="{{ACTION_URL}}" data-angle="{{ACTION_ANGLE}}">TIL 만들기</button>
  <div class="steer">
    <textarea placeholder="방향 지시 (비워 두면 리브가 알아서)"></textarea>
  </div>
  <p class="fb"><a class="feedback" data-verdict="실었어야 한다" data-item="{{TITLE}}" href="#">이건 왜 뺐나</a></p>
</article>
