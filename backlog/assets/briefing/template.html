<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리브의 아침 브리핑 · {{DATE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://til.kil9.dev/p/briefing/{{DATE}}/">
<link rel="icon" type="image/webp" href="data:image/webp;base64,{{FAVICON_B64}}">
<meta property="og:type" content="article">
<meta property="og:title" content="리브의 아침 브리핑 · {{DATE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="https://til.kil9.dev/p/briefing/{{DATE}}/">
<meta property="og:site_name" content="today i learned">

<meta name="twitter:card" content="summary">
<style>
  :root {
    --bg: #FFFFFF; --text: #1B2027; --text-muted: #4E5A66; --text-faint: #6E7A86;
    --rule: #E3E7EB; --accent: #1A5FC8; --chip: #F2F5F8; --panel: #F8FAFB;
    --hot: #C2410C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171B; --text: #E7EAEE; --text-muted: #A9B3BD; --text-faint: #7E8994;
      --rule: #2A3037; --accent: #82B1F0; --chip: #1D2228; --panel: #181C21;
      --hot: #F0906A;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1160px; margin: 0 auto; padding: 40px 28px 80px; }
  h1 { margin: 0 0 4px; font-size: 1.625rem; font-weight: 700; letter-spacing: -0.01em; }
  h2 { margin: 0 0 18px; font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.06em;
       text-transform: uppercase; color: var(--text-faint); }
  p { margin: 0 0 12px; }
  a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  code { font-family: ui-monospace, "SF Mono", monospace; font-size: 0.9em; }
  .meta { color: var(--text-faint); font-size: 0.8125rem; margin: 0 0 4px; }

  /* 머리말: 좌 리브 코멘트 + 우 오늘의 개요(읽기 전에 소비하는 지도) */
  .head { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 36px;
          margin: 28px 0 40px; align-items: start; }
  .toc { background: var(--panel); border-radius: 12px; padding: 14px 16px; }
  .toc h2 { margin: 0 0 10px; }
  .pick { border-bottom: 1px solid var(--rule); padding: 0 0 10px; margin: 0 0 10px; }
  .pick a { display: block; font-size: 0.875rem; font-weight: 650; color: var(--text);
            text-decoration: none; line-height: 1.4; }
  .pick a:hover { color: var(--accent); text-decoration: underline; }
  .pick .star { color: var(--hot); font-weight: 700; margin-right: 4px; }
  .pick p { margin: 3px 0 0; font-size: 0.75rem; color: var(--text-faint); line-height: 1.5; }
  .toc ol { list-style: none; margin: 0; padding: 0; counter-reset: t; }
  .toc li { counter-increment: t; display: grid; grid-template-columns: 20px 1fr;
            gap: 6px; align-items: baseline; font-size: 0.8125rem; padding: 4px 0;
            line-height: 1.45; }
  .toc li::before { content: counter(t, decimal-leading-zero); color: var(--text-faint);
                    font-variant-numeric: tabular-nums; font-size: 0.75rem; }
  .toc li a { color: var(--text-muted); text-decoration: none; }
  .toc li a:hover { color: var(--accent); text-decoration: underline; }

  /* 리브 코멘트 */
  .liv { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; margin: 0; }
  .liv img { grid-column: 1; grid-row: 1; width: 28px; height: 28px; margin-top: 2px;
             border-radius: 50%; background: #FFFFFF; }
  .liv p { grid-column: 2; margin: 0 0 8px; color: var(--text-muted); font-size: 0.9375rem; }
  .liv p:last-child { margin-bottom: 0; }
  .liv a { color: var(--text); text-decoration: underline;
           text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .liv a:hover { color: var(--accent); }
  .sticker-inline { float: right; height: 132px; width: auto; margin: 0 0 12px 20px;
                    shape-outside: margin-box; }
  .intro p { margin: 0 0 12px; color: var(--text-muted); font-size: 0.9375rem; }
  .intro p:last-child { margin-bottom: 0; }
  .intro a { color: var(--text); text-decoration: underline;
             text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .intro a:hover { color: var(--accent); }
  .sticker-hero { float: left; width: auto; height: 104px; margin: 0 20px 10px 0;
                  shape-outside: margin-box; }
  @media (max-width: 640px) { .sticker-hero { float: none; display: block;
                              margin: 0 auto 16px; } }
  @media (max-width: 520px) { .sticker-inline { float: none; display: block;
                              margin: 4px auto 16px; } }
  .side .liv { margin: 0 0 14px; }
  .side .liv img { width: 22px; height: 22px; }
  .side .liv p { font-size: 0.875rem; line-height: 1.55; }

  /* 항목: 좌(글) + 우(리브 한마디·액션) */
  .item { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 36px;
          border-top: 1px solid var(--rule); padding: 24px 0 22px; align-items: start;
          scroll-margin-top: 20px; }
  .item:first-of-type { border-top: 0; }
  @media (max-width: 900px) {
    .head, .item { grid-template-columns: 1fr; gap: 20px; }
  }
  .item h3 { margin: 0 0 10px; font-size: 1.1875rem; font-weight: 650; line-height: 1.4; }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--accent); text-decoration: underline; }
  .rank { color: var(--text-faint); font-variant-numeric: tabular-nums; font-weight: 500;
          margin-right: 10px; font-size: 1rem; }
  .item ul { margin: 0; padding-left: 18px; color: var(--text-muted); font-size: 0.9375rem; }
  .item li { margin: 0 0 5px; }
  .item li b { color: var(--text); font-weight: 600; }
  .lede { margin: 0 0 12px; font-size: 0.9375rem; color: var(--text); }
  .tiebox { font-size: 0.8125rem; line-height: 1.55; color: var(--text-muted);
            border-left: 2px solid var(--accent); padding: 1px 0 1px 11px; margin: 0 0 14px; }
  .tiebox .lbl { display: inline-block; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.04em;
              color: var(--accent); border: 1px solid currentColor; border-radius: 4px;
              padding: 0 5px; margin-right: 6px; vertical-align: 1px; }
  .foot { margin: 12px 0 0; font-size: 0.75rem; color: var(--text-faint); }

  /* 액션 */
  button {
    font: inherit; font-size: 0.8125rem; padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--rule); background: var(--chip); color: var(--text-muted);
    cursor: pointer; width: 100%;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.armed { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button:disabled { opacity: 0.6; cursor: default; }
  .steer { display: none; margin: 8px 0 0; }
  .steer.on { display: block; }
  .steer textarea {
    width: 100%; min-height: 62px; font: inherit; font-size: 0.8125rem; padding: 8px 10px;
    border: 1px solid var(--rule); border-radius: 10px; background: var(--bg);
    color: var(--text); resize: vertical;
  }
  .hint { font-size: 0.75rem; color: var(--text-faint); margin: 6px 0 0; }
  .sent { font-size: 0.8125rem; color: var(--accent); margin: 8px 0 0; }

  /* 하단: 넘긴 것들 */
  .rest { border-top: 1px solid var(--rule); margin-top: 24px; padding-top: 28px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 28px; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  .grid h4 { margin: 0 0 3px; font-size: 0.9375rem; font-weight: 600; line-height: 1.4; }
  .grid h4 a { color: var(--text); text-decoration: none; }
  .grid h4 a:hover { color: var(--accent); text-decoration: underline; }
  .grid p { margin: 0; color: var(--text-muted); font-size: 0.8125rem; line-height: 1.55; }
  .grid button { width: auto; margin-top: 8px; padding: 4px 11px; font-size: 0.75rem; }
  @media (hover: hover) {
    .grid button.go { opacity: 0; pointer-events: none; transition: opacity 0.12s; }
    .grid article:hover button.go,
    .grid article:focus-within button.go,
    .grid article:has(.steer.on) button.go,
    .grid button.go:disabled { opacity: 1; pointer-events: auto; }
  }
  .grid .steer textarea { min-height: 48px; font-size: 0.75rem; }
  .grid .sent { font-size: 0.75rem; }

  footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--rule);
           font-size: 0.8125rem; color: var(--text-faint); }
</style>
</head>
<body>
<main>
<p class="meta"><a href="{{ROOT_REL}}">← today i learned</a></p>

<h1>리브의 아침 브리핑</h1>
<p class="meta">{{DATE_KO}} · <a href="https://news.hada.io/">GeekNews</a> {{SCANNED}}건 훑어 {{PICKED}}건 · 정리 Claude Opus 5</p>

<div class="head">
  <div class="intro">
{{INTRO}}
  </div>

  <div class="toc">
    <h2>오늘의 개요</h2>
    <div class="pick">
      <a href="#{{PICK_ANCHOR}}"><span class="star">★</span>오늘 하나만 고른다면</a>
      <p>{{PICK_LINE}}</p>
    </div>
    <ol>
{{TOC_ITEMS}}
    </ol>
  </div>
</div>

{{ITEMS}}

<section class="rest">
  <h2>훑고 넘긴 것</h2>
  <div class="grid">
{{REST_ITEMS}}
  </div>
</section>

<footer>
  <p>수집 GeekNews · 정리 Claude Opus 5 · 선별 기준과 관심사 프로필은 <a href="{{ROOT_REL}}p/liv-briefing/">브리핑 소개</a> 에 있습니다.</p>
  <p><a href="{{ARCHIVE_REL}}">지난 브리핑</a> · <a href="{{ROOT_REL}}">← today i learned</a></p>
</footer>
</main>

<script>
document.querySelectorAll('button.go').forEach(function (b) {
  var steer = b.parentElement.querySelector('.steer');
  b.addEventListener('click', function () {
    if (!steer.classList.contains('on')) {
      steer.classList.add('on');
      steer.querySelector('textarea').focus();
      b.classList.add('armed');
      b.textContent = '이대로 리브에게 맡기기';
      return;
    }
    var note = steer.querySelector('textarea').value.trim();
    var body = 'SOURCE: briefing ({{DATE}})\nKIND: submit\nREQUEST:\n'
      + b.dataset.topic + ' — ' + b.dataset.url + '\n'
      + '원문을 직접 읽고 til 페이지로 만들어 주세요.\n조사 방향: ' + b.dataset.angle
      + (note ? '\n관리자 지시: ' + note : '');
    if (navigator.clipboard) navigator.clipboard.writeText(body);
    console.log(body);
    steer.classList.remove('on');
    b.disabled = true;
    b.classList.remove('armed');
    b.textContent = '리브가 작업 중';
    var s = document.createElement('p');
    s.className = 'sent';
    s.textContent = '접수했습니다. 완성되면 til 에 올리고 Slack 으로 알려 드리겠습니다.';
    b.after(s);
  });
});
</script>
