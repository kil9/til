<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<style>
  :root {
    --bg: #FFFFFF; --text: #1B2027; --text-muted: #4E5A66; --text-faint: #6E7A86;
    --rule: #E3E7EB; --accent: #1A5FC8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171B; --text: #E7EAEE; --text-muted: #A9B3BD; --text-faint: #7E8994;
      --rule: #2A3037; --accent: #82B1F0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
  h2 {
    margin: 32px 0 10px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em;
    color: var(--text-faint); font-family: ui-monospace, "SF Mono", monospace;
  }
  p { margin: 0 0 12px; }
  a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .meta { color: var(--text-faint); font-size: 0.8125rem; }
  .rows { display: grid; gap: 2px; }
  .row {
    display: grid; grid-template-columns: 88px 1fr; gap: 12px; align-items: baseline;
    padding: 8px 0; border-top: 1px solid var(--rule); text-decoration: none; color: inherit;
  }
  .row .d {
    font-family: ui-monospace, "SF Mono", monospace; font-size: 0.8125rem;
    color: var(--text-faint); font-variant-numeric: tabular-nums;
  }
  .row .t { font-size: 0.9375rem; color: var(--text-muted); line-height: 1.55; }
  .row:hover .t, .row:focus-visible .t { color: var(--accent); text-decoration: underline; }
  /* 읽음 표시(task-93)는 JS 가 붙인다. 안 붙으면 아래 규칙이 하나도 안 걸려 원래 모습이다. */
  .row.read .d, .row.read .t { color: var(--text-faint); }
  .row.unread .t { color: var(--text); }
  .unread-line { font-size: 0.875rem; color: var(--text-muted); }
  .unread-line b { color: var(--text); font-weight: 600; }
  .row.unread .d::after {
    content: "●"; margin-left: 6px; font-size: 0.5rem; color: var(--accent); vertical-align: 2px;
  }
  footer {
    margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--rule);
    font-size: 0.8125rem; color: var(--text-faint);
  }
</style>
</head>
<body>
<main>
  <p class="meta" style="margin:0 0 28px"><a href="../../../">← today i learned</a></p>
  <h1>지난 브리핑</h1>
  <p class="meta">리브가 아침마다 인터넷을 훑어 정리한 것들. 모두 {{COUNT}}회.
    <a href="../">오늘 것</a> 은 따로 있습니다.</p>
  <p class="unread-line" hidden>안 읽은 회차 <b id="unread-n">0</b>건 ·
    <a id="unread-oldest" href="../">가장 오래된 것부터 보기 →</a></p>
{{ROWS}}
  <footer>
    <p><a href="../">오늘의 브리핑</a> · <a href="../../liv-briefing/">브리핑 소개</a> · <a href="../../../">← today i learned</a></p>
  </footer>
</main>
<script>
// 읽음/안읽음 (task-93). 회차 페이지가 localStorage 에 남긴 날짜로 행을 가른다.
// 주간 리캡 행에는 data-date 가 없어 그대로 둔다.
try {
  var read = JSON.parse(localStorage.getItem('liv-briefing-read') || '[]');
  var unread = [];
  document.querySelectorAll('.row[data-date]').forEach(function (row) {
    var isUnread = read.indexOf(row.dataset.date) < 0;
    row.classList.add(isUnread ? 'unread' : 'read');
    if (isUnread) unread.push(row.dataset.date);
  });
  // 목록은 최신이 위라 마지막 원소가 가장 오래된 안 읽은 회차다 (task-96).
  if (unread.length) {
    document.getElementById('unread-n').textContent = unread.length;
    document.getElementById('unread-oldest').href = '../' + unread[unread.length - 1] + '/';
    document.querySelector('.unread-line').hidden = false;
  }
} catch (e) { /* 저장소가 막혀 있으면 구분 없이 보여준다 */ }
</script>

</body>
</html>
