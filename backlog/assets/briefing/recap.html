<style>
  :root {
    --bg: #FFFFFF; --text: #1B2027; --text-muted: #4E5A66; --text-faint: #6E7A86;
    --rule: #E3E7EB; --accent: #1A5FC8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171B; --text: #E7EAEE; --text-muted: #A9B3BD; --text-faint: #7E8994;
      --rule: #2A3037; --accent: #82B1F0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.4; }
  h2 { margin: 40px 0 12px; font-size: 1.0625rem; font-weight: 600; }
  p { margin: 0 0 16px; }
  a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .meta { color: var(--text-faint); font-size: 0.8125rem; line-height: 1.6; }
  .liv { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; margin: 28px 0 0; }
  .liv img { grid-column: 1; grid-row: 1; width: 28px; height: 28px; margin-top: 2px;
             border-radius: 50%; background: #FFFFFF; }
  .liv p { grid-column: 2; margin: 0 0 8px; color: var(--text-muted); font-size: 0.9375rem; }
  .liv p:last-child { margin-bottom: 0; }
  /* 헤드라인 — 제목 아래 한 줄이 제목이 말하지 않은 것을 보탠다 */
  .dek { margin: 0 0 10px; font-size: 1.0625rem; font-weight: 600; line-height: 1.5;
         letter-spacing: -0.005em; color: var(--text-muted); }
  /* 요일 타임라인 — 회차별 한 줄. 이야기 앞에 그 주의 모양을 먼저 보인다 */
  .timeline { margin: 32px 0 44px; padding-top: 18px; border-top: 1px solid var(--rule); }
  .timeline h2 { margin: 0 0 12px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em;
                 text-transform: uppercase; color: var(--text-faint); }
  .timeline ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .timeline li { display: grid; grid-template-columns: auto 1fr; gap: 14px;
                 font-size: 0.875rem; line-height: 1.6; align-items: baseline; }
  .timeline li > a { text-decoration: none; color: var(--text-faint); white-space: nowrap;
                     font-variant-numeric: tabular-nums; }
  .timeline li > a:hover { color: var(--accent); }
  .timeline .wd { font-weight: 600; color: var(--text); margin-right: 7px; }
  .timeline .ln { color: var(--text-muted); }
  @media (max-width: 480px) {
    .timeline li { grid-template-columns: 1fr; gap: 2px; }
  }
  footer {
    margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--rule);
    font-size: 0.8125rem; color: var(--text-faint);
  }
</style>
</head>
<body>
<main>
  <p class="meta" style="margin:0 0 28px"><a href="../../../../">← today i learned</a></p>

  <h1>{{TITLE}}</h1>
  <p class="dek">{{DESCRIPTION}}</p>
  <p class="meta">{{RANGE}} 브리핑 {{COUNT}}회를 관통해서 봤습니다 · 정리 Claude Opus 5</p>

  <section class="timeline">
    <h2>이번 주</h2>
    <ul>
{{TIMELINE}}
    </ul>
  </section>

{{BODY}}

  </div>

    <p><a href="../../../../">← today i learned</a></p>
  </footer>
</main>
